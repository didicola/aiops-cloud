name: eon-fleet-lane

# EON CLOUD FLEET LANE (2026-10-16)
#
# The guardian lane for the 200-for-ALL fleet, running entirely on GitHub's cloud
# runners: no home host (Ubuntu / twins / phone) has to be online for the fleet to
# be probed and healed. Workers are enumerated from the Cloudflare API and Pages
# from the PAGES list inside the healer.
#
# Why GitHub Actions and not a Worker: Cloudflare blocks Worker->Worker fetches in
# the same zone (error 1042), so a Worker can neither probe nor re-upload its peers
# over HTTP. An external runner has no such limit — this lane is that runner.
#
# Secrets used (already present in this repo):
#   CF_DEPLOY_TOKEN     — Cloudflare API token with Workers Scripts:Edit
#   CF_ACCOUNT_ID       — Cloudflare account id
#   TELEGRAM_BOT_TOKEN  — bot used for the lane report
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: eon-fleet-lane
  cancel-in-progress: false

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fleet probe + heal (workers + pages)
        env:
          CF_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CF_ACC: ${{ secrets.CF_ACCOUNT_ID }}
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: "6663994526"
          EON_LANE: "gh-actions"
        run: |
          set -o pipefail
          python3 tools/fleet/eon200-heal-lite.py --heal --index tools/fleet/eon200-index.html | tee lane.json
          python3 - <<'PY'
          import json
          d = json.load(open("lane.json"))
          print(f"lane summary: all200={d.get('all200')} workers={d.get('workers_ok')}/{d.get('workers')} "
                f"pages={d.get('pages_ok')}/{d.get('pages')} healed={d.get('healed')} broken={d.get('broken')}")
          if d.get("broken"):
              raise SystemExit(1)
          PY

      - name: Upload lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-lane-report
          path: lane.json
          retention-days: 7
