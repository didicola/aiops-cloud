name: deploy-eon-hub

# Deploys the own-cloud code hub (eon-hub) into our own Cloudflare account.
# Uses the same CF_DEPLOY_TOKEN secret as restart-cloud — no local tokens needed.
on:
  repository_dispatch:
    types: [deploy-eon-hub]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Deploy eon-hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler deploy --config wrangler.eon-hub.toml --name eon-hub
      - name: Verify eon-hub live
        run: |
          curl -s -o /dev/null -w "eon-hub HTTP %{http_code}\n" https://eon-hub.exportdefaultasyncfetchrequestenvconsturl.workers.dev/
